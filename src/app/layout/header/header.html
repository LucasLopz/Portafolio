<header class="header card card--sm">
  <a class="header__brand" [routerLink]="['/', lang()]">{{ content().hero.name }}</a>

  <!-- [routerLink]="[]" + fragment arma /es#about: queda en la página actual y baja a la sección.
       El orden del menú sigue el orden de la página. -->
  <nav class="header__nav" [attr.aria-label]="content().header.navLabel">
    <ul>
      <li>
        <a [routerLink]="[]" fragment="projects">{{ content().projects.title }}</a>
      </li>
      <li>
        <a [routerLink]="[]" fragment="skills">{{ content().skills.title }}</a>
      </li>
      <li>
        <a [routerLink]="[]" fragment="about">{{ content().about.title }}</a>
      </li>
      <li>
        <a [routerLink]="[]" fragment="contact">{{ content().contact.title }}</a>
      </li>
    </ul>
  </nav>

  <!-- Enlace común a la otra URL: cada idioma tiene su dirección propia (mejor para SEO).
       Se ve "EN" o "ES"; el aria-label da la descripción completa e incluye el texto visible,
       así quien navega por voz puede decir "EN" y el lector de pantalla lee la frase entera. -->
  <div class="header__actions">
    <a
      class="header__lang"
      [routerLink]="['/', otherLang()]"
      [attr.hreflang]="otherLang()"
      [attr.aria-label]="content().header.switchAriaLabel"
    >
      {{ content().header.switchLabel }}
    </a>

    <!-- Botón de tema.
       - aria-pressed: el lector de pantalla anuncia "Modo oscuro, botón, presionado / no presionado".
       - El nombre es fijo, así el HTML prerenderizado es correcto para cualquier visitante.
       - Los dos íconos están en el HTML y el CSS muestra uno según data-theme: se ve bien
         desde el primer instante, antes de que arranque Angular. -->
    <button
      type="button"
      class="theme-toggle"
      [attr.aria-label]="content().header.themeLabel"
      [attr.aria-pressed]="theme.isDark()"
      (click)="theme.toggle()"
    >
      <!-- Luna: se ve en modo claro (pasar a oscuro). -->
      <svg class="icon icon--moon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
      <!-- Sol: se ve en modo oscuro (pasar a claro). -->
      <svg class="icon icon--sun" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
        />
      </svg>
    </button>
  </div>
</header>
