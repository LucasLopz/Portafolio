<section id="skills" class="section" aria-labelledby="skills-title">
  <h2 id="skills-title">{{ content().title }}</h2>

  <!-- Lista de definiciones: cada grupo (dt) con sus tecnologías (dd), en una tarjeta chica. -->
  <dl class="grid skills">
    @for (group of content().groups; track group.name) {
      <div class="card card--sm skill">
        <dt class="label">{{ group.name }}</dt>
        <dd>{{ group.items.join(', ') }}</dd>
      </div>
    }
  </dl>
</section>
