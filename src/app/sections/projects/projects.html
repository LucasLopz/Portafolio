<section id="projects" aria-labelledby="projects-title">
  <h2 id="projects-title">{{ content().title }}</h2>

  <!-- Una tarjeta por proyecto: para sumar uno nuevo alcanza con agregarlo en es.ts y en.ts. -->
  @for (project of content().items; track project.name) {
    <app-project-card [project]="project" [labels]="content().labels" />
  }
</section>
