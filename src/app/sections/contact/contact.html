<section id="contact" class="section" aria-labelledby="contact-title">
  <h2 id="contact-title">{{ content().title }}</h2>

  <!-- Solo botones, sin formulario (docs/decisiones.md). Los tres tienen el mismo peso. -->
  <ul class="card contact">
    <li>
      <a
        class="btn btn--secondary"
        [href]="links.linkedin"
        target="_blank"
        rel="noopener noreferrer"
      >
        {{ content().linkedinLabel }}
      </a>
    </li>
    <li>
      <a class="btn btn--secondary" [href]="links.github" target="_blank" rel="noopener noreferrer">
        {{ content().githubLabel }}
      </a>
    </li>
    <li>
      <!-- mailto: abre el programa de correo del visitante con la dirección ya cargada. -->
      <a class="btn btn--secondary" [href]="'mailto:' + links.email">{{ content().emailLabel }}</a>
    </li>
  </ul>
</section>
